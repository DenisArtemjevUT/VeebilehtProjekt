<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>OOP – 2. KT ül Linnud</title>

    <style>
        body{ margin:0; font-family: system-ui, sans-serif; background: rgb(225, 224, 224); }
        .top-bar { background:#86cfe8; height:100px; position:relative; z-index:10; }
        .back-button{
            position:absolute; left:16px; top:18px;
            width:38px; height:38px; background: rgba(255,255,255,0.45);
            border-radius:12px; display:flex; align-items:center; justify-content:center;
            font-size:22px; font-weight:700; color:#0b2230; cursor:pointer; user-select:none; z-index:20;
        }
        .title-pill{
            position:absolute; left:50%; top:18px; transform:translateX(-50%);
            background:#e9edf0; padding:12px 28px; border-radius:999px;
            font-size:17px; font-weight:500; color:#1f2a33;
            box-shadow:0 3px 6px rgba(0,0,0,0.15); white-space:nowrap; z-index:15;
        }
        .material-view-main { margin: 50px auto 40px auto; max-width: 1000px; padding: 0 16px; }
        .material-header{
            background:#e9edf0; border-radius:999px; padding:14px 28px;
            display:flex; justify-content:space-between; align-items:center;
            box-shadow:0 3px 6px rgba(0,0,0,0.15); margin-bottom:20px;
        }
        .material-title{ font-size:16px; font-weight:500; color:#1f2a33; }
        .open-file-btn{
            display:inline-block; margin-bottom:20px; background:#e9edf0;
            padding:10px 20px; border-radius:999px; text-decoration:none;
            color:#1f2a33; font-size:15px; box-shadow:0 3px 6px rgba(0,0,0,0.15);
        }
        .open-file-btn:hover{ filter:brightness(1.03); box-shadow:0 4px 10px rgba(0,0,0,0.20); }
        .pdf-frame-wrapper{ background:#e9edf0; padding:10px; border-radius:16px; box-shadow:0 3px 6px rgba(0,0,0,0.15); }
        .pdf-frame{ width:100%; height:600px; border:none; }
    </style>

    <script src="./script.js" defer></script>
</head>

<body>
    <div class="top-bar">
        <div class="back-button" id="TagasiOopLoend">&#8592;</div>
        <div class="title-pill">Objektorienteeritud programmeerimine</div>
    </div>

    <main class="material-view-main">
        <div class="material-header">
            <span class="material-title">2. KT ül Linnud</span>
        </div>

        <a class="open-file-btn"
           href="õppematerjalid/OOP/2.%20KT%20%C3%BCl%20Linnud.pdf"
           target="_blank">Ava fail</a>

        <div class="pdf-frame-wrapper">
            <object class="pdf-frame"
                    data="õppematerjalid/OOP/2.%20KT%20%C3%BCl%20Linnud.pdf"
                    type="application/pdf">
                <p>
                    Sinu brauser ei toeta PDF eelvaadet.
                    <a href="õppematerjalid/OOP/2.%20KT%20%C3%BCl%20Linnud.pdf" target="_blank">Ava fail</a>
                </p>
            </object>
        </div>
    </main>
</body>
</html>
