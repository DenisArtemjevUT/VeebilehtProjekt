<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Andmebaasid</title>

    <style>
        body{
            margin:0;
            font-family: system-ui, sans-serif;
            background: rgb(225, 224, 224);
        }

        .top-bar {
            background: #86cfe8;
            height: 100px;
            position: relative;
            z-index: 10;
        }

        .back-button {
            position:absolute;
            left:16px;
            top:18px;

            width:38px;
            height:38px;
            background: rgba(255,255,255,0.45);
            border-radius:12px;

            display:flex;
            align-items:center;
            justify-content:center;

            font-size:22px;
            font-weight:700;
            color:#0b2230;
            cursor:pointer;
            user-select:none;
            z-index: 20;
        }

        .title-pill {
            position:absolute;
            left:50%;
            top:18px;
            transform:translateX(-50%);

            background:#e9edf0;
            padding:12px 28px;
            border-radius:999px;

            font-size:17px;
            font-weight:500;
            color:#1f2a33;

            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            white-space:nowrap;
            z-index: 15;
        }

        .materials-main {
            margin: 50px auto 40px auto;
            max-width: 900px;
            padding: 0 16px;
        }

        .material-card {
            background:#e9edf0;
            padding:14px 28px;
            border-radius:999px;

            font-size:16px;
            font-weight:500;
            color:#1f2a33;

            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            margin-bottom:20px;

            cursor:pointer;
            user-select:none;
        }

        .material-card:hover {
            filter:brightness(1.02);
            box-shadow:0 4px 10px rgba(0,0,0,0.20);
        }
    </style>

    <!-- oluline: defer -->
    <script src="./script.js" defer></script>
</head>

<body>
    <div class="top-bar">
        <div class="back-button" id="TagasiIndex">&#8592;</div>
        <div class="title-pill">Andmebaasid</div>
    </div>

    <main class="materials-main">
        <div class="material-card" id="AbEksami1">Eksami I osa</div>
        <div class="material-card" id="AbEksami2">Eksami II osa – näidis</div>
    </main>
</body>
</html>
